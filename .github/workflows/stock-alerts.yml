name: stock-alerts

on:
  schedule:
    # Every 5 min, Mon-Fri, 13:00-21:59 UTC = US market hours in both summer and winter time
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message with current prices"
        type: boolean
        default: false

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # Remembers which alerts already fired, so you aren't spammed every 5 minutes
      - uses: actions/cache/restore@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check prices
        run: python3 stock_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEST: ${{ inputs.test && '1' || '0' }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
